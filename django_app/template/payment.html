<!DOCTYPE html>
{% load static %}
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الدفع - جدير</title>
    <style>
        :root {
            --primary-color: #e67e22;
            --secondary-color: #27ae60;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .payment-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .header h2 { color: var(--primary-color); margin-bottom: 5px; }
        .header p { color: #666; font-size: 0.9em; }

        .payment-methods {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: #fff5eb;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed var(--primary-color);
        }

        .method { font-weight: bold; color: #333; }
        .method span { display: block; color: var(--secondary-color); font-size: 1.2em; margin-top: 5px; }

        .upload-section {
            margin-top: 25px;
            text-align: right;
        }

        label { display: block; margin-bottom: 8px; font-weight: 600; }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        .btn-confirm {
            background: var(--secondary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-confirm:hover { background: #219150; transform: translateY(-2px); }

        .instapay-logo { width: 80px; margin-top: 10px; }
    </style>
    <script src="{% static 'js/main.js' %}"></script>
    <script type="text/javascript">
	<!--------first----------->
		var user = '{{request.user}}'

	<!--------second update button----------->
	function getToken(name) {
    var cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            // Does this cookie string begin with the name we want?
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
var csrftoken = getToken('csrftoken');


<!--------third----------->

function getCookie(name){
	var cookieArr = document.cookie.split(";");

	for(var i=0; i<cookieArr.length;i++){
		var cookiePair = cookieArr[i].split("=");

		if(name == cookiePair[0].trim()){
			return decodeURIComponent(cookiePair[i]);
		}
	}
	return null;
}


	var cart=JSON.parse(getCookie("cart"))

	if(cart == undefined){
		cart = {}
		console.log('cart was created!')
		document.cookie = 'cart=' + JSON.stringify(cart)+ ";domain=;path=/"
	}
	console.log('cart:',cart)

</script>

</head>
<body>

<div class="payment-card">
    <div class="header">
        <h2>تأكيد عملية الدفع 💸</h2>
        <p>يرجى تحويل مبلغ <strong>{{ order.get_cart_total|floatformat:2 }} ج.م</strong> عبر إحدى الوسائل التالية:</p>
    </div>

    <div class="payment-methods">
        <div class="method">
            فودافون كاش

        <div class="method">

        </div>
    </div>

    <form method="POST" enctype="multipart/form-data" action="{% url 'confirm_payment' %}">
        {% csrf_token %}
        <div class="upload-section">
            <label for="receipt">أرفق صورة إيصال التحويل:</label>
            <input type="file" id="receipt" name="receipt_image" accept="image/*" required>
        </div>

        <button id="make-payment" type="submit" class="btn-confirm">تأكيد الطلب الآن ✅</button>

    </form>

    <p style="font-size: 0.8em; color: #999; margin-top: 15px;">
        * سيتم مراجعة الطلب وتأكيده خلال 15 دقيقة من التحويل.
    </p>
</div>

</html>
